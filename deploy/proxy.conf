server {
    listen 80;
    server_name www.parnasoft.ir;

    location ^~ /.well-known/acme-challenge/ {
        set $tls_upstream gamification-tls;
        proxy_set_header Host $host;
        proxy_pass http://$tls_upstream:80;
    }

    location / {
        return 301 https://parnasoft.ir$request_uri;
    }
}

server {
    listen 80;
    server_name parnasoft.ir;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    location ^~ /.well-known/acme-challenge/ {
        set $tls_upstream gamification-tls;
        proxy_set_header Host $host;
        proxy_pass http://$tls_upstream:80;
    }

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # The path in front of this server drops any URL containing /chunks/.
    # Chunk paths are rewritten so the browser requests /assets/c/ instead.
    sub_filter_once off;
    sub_filter_types text/css text/javascript application/javascript application/json text/x-component;
    sub_filter "/_next/static/chunks/" "/assets/c/";
    sub_filter "\\/_next\\/static\\/chunks\\/" "\\/assets\\/c\\/";
    sub_filter "static/chunks/" "../assets/c/";
    sub_filter "static\\/chunks\\/" "..\\/assets\\/c\\/";

    location /assets/c/ {
        set $parnasoft_upstream parnasoft-frontend;
        rewrite ^/assets/c/(.*)$ /_next/static/chunks/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://$parnasoft_upstream:3000;
    }

    location /assets/media/ {
        set $parnasoft_upstream parnasoft-frontend;
        rewrite ^/assets/media/(.*)$ /_next/static/media/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://$parnasoft_upstream:3000;
    }

    location / {
        # Redirect plain HTTP clients to HTTPS; CDN requests with
        # X-Forwarded-Proto: https continue to the app.
        if ($forwarded_proto != "https") {
            return 301 https://parnasoft.ir$request_uri;
        }

        set $parnasoft_upstream parnasoft-frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Accept-Encoding "";
        proxy_pass http://$parnasoft_upstream:3000;
    }
}
